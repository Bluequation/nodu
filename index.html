 case 'edit-plan':{const p=db.plans.find(x=>x.id===id);if(p){db.planDraft=JSON.parse(JSON.stringify(p));db.planDraft.editingId=p.id;save();goto('verticalizer')}break}
 case 'delete-plan':if(confirm('Excluir este plano? Os flashcards, questões e erros já registrados não serão apagados.')){db.plans=db.plans.filter(x=>x.id!==id);if(activePlanId===id)activePlanId='';save();render()}break;
 case 'reset-empty':if(confirm('Apagar TODOS os dados deste navegador e começar do zero?')){db=emptyDb();save();goto('dashboard')}break;
 case 'reset-demo':if(confirm('Apagar seus dados e restaurar os exemplos?')){db=demoDb();save();goto('dashboard')}break;
 }}
/* Editor de imagem: guardar estado do formulário antes de abrir outro modal. */
function storeEditorBuffer(){if(!document.getElementById('concept-form'))return;window.conceptEditorBuffer=[...document.querySelectorAll('[data-variant]')].map(x=>{let mask=null;try{mask=JSON.parse(x.querySelector('[data-mask]').value)}catch(e){}return {kind:x.querySelector('[data-kind]').value,format:x.querySelector('[data-format]').value,q:x.querySelector('[data-q]').value,a:x.querySelector('[data-a]').value,reason:x.querySelector('[data-reason]').value,source:x.querySelector('[data-source]').value,image:x.querySelector('[data-image]').value,mask}});window.conceptBufferHeader={subject:document.getElementById('concept-subject').value,topic:document.getElementById('concept-topic').value,source:document.getElementById('concept-source').value};}
function reopenBufferedConcept(){let buf=window.conceptEditorBuffer,header=window.conceptBufferHeader,id=editConceptId;closeModal();conceptModal(id);document.getElementById('concept-subject').value=header.subject;document.getElementById('concept-topic').value=header.topic;document.getElementById('concept-source').value=header.source;document.getElementById('variant-list').innerHTML=buf.map(variantEditorRow).join('');window.conceptEditorBuffer=null;window.conceptBufferHeader=null}
/* Events */
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-view],[data-action],[data-grade],[data-day]');if(!el){if(ev.target.id==='modal-wrap'){if(maskDraft&&window.conceptEditorBuffer)reopenBufferedConcept();else closeModal()}return}if(el.dataset.view){goto(el.dataset.view);return}if(el.dataset.day){dayModal(el.dataset.day);return}if(el.dataset.grade&&!el.dataset.action){recordRate(el.dataset.grade);return}if(el.dataset.action==='edit-image')storeEditorBuffer();if(el.dataset.action)action(el)});
document.addEventListener('change',async ev=>{let x=ev.target;
 if(x.id==='learn-interleave-subject'){learnInterleaveSubject=x.value;render();return}
 if(x.id==='session-choice'){session=x.value;previewedIds.clear();if(session==='kind'&&!extraKind)extraKind=KINDS[0];card=null;render();return}
 if(x.id==='kind-choice'){extraKind=x.value;card=null;render();return}
 if(x.id==='leech-input'){db.settings.leech=Number(x.value);save();render();return}
 if(x.id==='import-cards-file'){const f=x.files?.[0];if(!f)return;if(f.size>3000000)return alert('Arquivo acima de 3 MB.');const t=await f.text();document.getElementById('import-cards-text').value=t;previewImport();return}
 if(x.id==='restore-file'){restoreDb(x.files?.[0]);return}
 if(x.id==='plan-source-file'){try{await readPlanFile(x.files?.[0])}catch(e){alert(e.message)}return}
 if(x.id==='plan-json-file'){const f=x.files?.[0];if(!f)return;try{document.getElementById('vertical-json').value=await f.text();importVerticalJson(document.getElementById('vertical-json').value)}catch(e){alert('JSON inválido: '+e.message)}return}
 if(x.matches('[data-tree-select]')){const n=findPlanNode(db.planDraft?.tree,x.dataset.treeSelect);if(n){setNodeSelected(n,x.checked);syncNodeSelection(db.planDraft.tree);save();render()}return}
 if(x.matches('[data-plan-day]')){const a=db.planDraft?.assignments?.find(z=>z.nodeId===x.dataset.planDay);if(a){a.day=Number(x.value);save();notify('Dia atualizado.')}return}
 if(x.matches('[data-plan-done]')){const p=db.plans.find(z=>z.id===activePlanId),a=p?.assignments?.find(z=>z.nodeId===x.dataset.planDone);if(a){a.done=x.checked;a.doneAt=x.checked?now():null;p.updatedAt=now();save();render()}return}
 if(['error-subject','error-discipline','error-area','error-topic'].includes(x.id)){if(x.value==='__new__'){let added=addTaxonomy(x.id);syncTaxonomy(x.id,added||'')}else syncTaxonomy(x.id);return}
 if(x.id==='mask-file'){try{maskDraft.image=await fileToDataUrl(x.files?.[0]);document.getElementById('mask-stage').innerHTML=`<img src="${esc(maskDraft.image)}" alt="Imagem para ocultar"><div id="mask-selection" style="left:30%;top:30%;width:25%;height:18%"></div>`;maskDraft.mask={x:30,y:30,w:25,h:18}}catch(e){alert(e.message)}return}
});
document.addEventListener('input',ev=>{if(ev.target.id==='retention-input'){db.settings.retention=Number(ev.target.value)/100;save();const tag=document.querySelector('.panel-head .tag');if(tag)tag.textContent=ev.target.value+'%'}if(ev.target.id==='typed-value')typedValue=ev.target.value});
document.addEventListener('submit',ev=>{ev.preventDefault();let f=ev.target;
 if(f.id==='learn-response-form')submitLearnResponse(f);
 if(f.id==='learn-choice-form'){if(!learnState)return;const selected=f.querySelector('input[name="learn-choice"]:checked')?.value;if(!selected)return alert('Selecione uma alternativa.');learnState.response=selected;learnState.revealed=true;const e=currentLearnError();learnState.autoGrade=e?.correctAnswer&&parseErrorOptions(e.optionsText).length>1&&parseErrorOptions(e.optionsText).every(o=>/^[A-E]$/.test(o.key))?learnAutoGrade(selected,e):'';render()}
 if(f.id==='concept-form')saveConcept();
 if(f.id==='plan-source-form'){const title=document.getElementById('plan-title').value.trim(),cargo=document.getElementById('plan-cargo').value.trim();if(!title||!cargo)return alert('Informe o nome do plano e o cargo/área.');db.planDraft.meta={...(db.planDraft.meta||{}),title,institution:document.getElementById('plan-institution').value.trim(),cargo,area:document.getElementById('plan-area').value,organizer:document.getElementById('plan-organizer').value.trim(),examDate:document.getElementById('plan-exam-date').value,sourceFile:db.planDraft.meta?.sourceFile||''};db.planDraft.sourceText=document.getElementById('plan-source-text').value.trim();save();render();notify('Dados do edital salvos. Agora você pode gerar a estrutura com IA ou montar manualmente.');}
 if(f.id==='vertical-json-form'){try{importVerticalJson(document.getElementById('vertical-json').value)}catch(e){alert('Não consegui importar a estrutura: '+e.message)}}
 if(f.id==='plan-node-form'){const name=document.getElementById('plan-node-name').value.trim();if(!name)return alert('Informe o nome do conteúdo.');const origin=document.getElementById('plan-node-origin').value,sourceRef=document.getElementById('plan-node-ref').value.trim(),sourceText=document.getElementById('plan-node-source').value.trim(),mode=planNodeEditor?.mode,id=planNodeEditor?.id;const node=id?findPlanNode(db.planDraft.tree,id):null;if(mode==='edit'&&node){Object.assign(node,{name,origin,sourceRef,sourceText});if(origin==='suggested')node.selected=false}else{const fresh={id:uid(),name,origin,sourceRef,sourceText,selected:origin!=='suggested',collapsed:false,children:[]};if(mode==='add-child'&&node)node.children.push(fresh);else db.planDraft.tree.push(fresh)}syncNodeSelection(db.planDraft.tree);save();closeModal();render();notify('Conteúdo atualizado.')}
 if(f.id==='plan-schedule-form'){const days=[...document.querySelectorAll('input[name="plan-days"]:checked')].map(x=>Number(x.value));if(!days.length)return alert('Selecione ao menos um dia disponível.');db.planDraft.scheduleConfig={startDate:document.getElementById('schedule-start').value,examDate:document.getElementById('schedule-exam').value,days,minutes:Number(document.getElementById('schedule-minutes').value),mode:document.getElementById('schedule-mode').value};db.planDraft.meta.examDate=db.planDraft.scheduleConfig.examDate||db.planDraft.meta.examDate||'';plansScheduleAssignments();}
 if(f.id==='block-form'){let total=Number(document.getElementById('block-total').value),correct=Number(document.getElementById('block-correct').value),topic=document.getElementById('block-topic').value.trim();if(!topic||!Number.isInteger(total)||total<1||!Number.isInteger(correct)||correct<0||correct>total)return alert('Confira o número de questões e acertos.');db.blocks.push({id:uid(),subject:document.getElementById('block-subject').value,topic,total,correct,note:document.getElementById('block-note').value.trim(),at:now()});save();closeModal();render()}
 if(f.id==='error-form')saveError();
 if(f.id==='confidence-form'){let sub=document.getElementById('conf-sub').value,topic=document.getElementById('conf-topic').value.trim(),level=Number(document.getElementById('conf-level').value);if(!topic)return alert('Informe um assunto.');db.confidence[sub+'|'+normalize(topic)]={subject:sub,topic,level,at:now()};save();closeModal();render()}
 if(f.id==='limits-form'){let n=Number(f.elements.new.value),r=Number(f.elements.reviews.value);if(!Number.isInteger(n)||n<0||n>200||!Number.isInteger(r)||r<1||r>1000)return alert('Limites inválidos.');db.settings.newLimit=n;db.settings.reviewLimit=r;save();render();notify('Limites de estudo atualizados.')}
 if(f.id==='edit-variant-form'){let x=window.variantEditing,c=db.concepts.find(c=>c.id===x?.id),v=c?.variants?.[x.i];if(!v)return;let q=document.getElementById('variant-q').value.trim(),a=document.getElementById('variant-a').value.trim();if(!q||!a)return alert('Pergunta e resposta são obrigatórias.');Object.assign(v,{q,a,kind:document.getElementById('variant-kind').value,format:document.getElementById('variant-format').value,reason:document.getElementById('variant-reason').value,source:document.getElementById('variant-source').value,status:'pending'});save();closeModal();render();}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){if(maskDraft&&window.conceptEditorBuffer)reopenBufferedConcept();else closeModal();return}if(view!=='review'||modal)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(ev.key===' '){ev.preventDefault();if(!shown){shown=true;render()}}else if(shown&&/^[1-4]$/.test(ev.key))recordRate(['again','hard','good','easy'][Number(ev.key)-1])});
/* mask selection pointer events */
document.addEventListener('pointerdown',ev=>{let stage=ev.target.closest('#mask-stage');if(!stage||!maskDraft?.image)return;ev.preventDefault();let r=stage.getBoundingClientRect();maskDragStart={x:clamp((ev.clientX-r.left)/r.width*100,0,100),y:clamp((ev.clientY-r.top)/r.height*100,0,100)};stage.setPointerCapture(ev.pointerId)});
document.addEventListener('pointermove',ev=>{let stage=document.getElementById('mask-stage');if(!stage||!maskDragStart)return;let r=stage.getBoundingClientRect(),x=clamp((ev.clientX-r.left)/r.width*100,0,100),y=clamp((ev.clientY-r.top)/r.height*100,0,100),m={x:Math.min(x,maskDragStart.x),y:Math.min(y,maskDragStart.y),w:Math.abs(x-maskDragStart.x),h:Math.abs(y-maskDragStart.y)};maskDraft.mask=m;Object.assign(document.getElementById('mask-selection').style,{left:m.x+'%',top:m.y+'%',width:m.w+'%',height:m.h+'%'})});
document.addEventListener('pointerup',()=>{if(maskDraft?.mask){maskDraft.mask.w=Math.max(2,maskDraft.mask.w);maskDraft.mask.h=Math.max(2,maskDraft.mask.h)}maskDragStart=null});
save();render();

</script></body></html>
