/* ==========================================================
   RITMO 7.1 — direção visual inspirada em plataformas de
   aprendizagem interativa: espaço, clareza, contraste e verde.
   Mantém identidade própria e preserva os componentes/fluxos.
   ========================================================== */
:root{
 --bg:#f6f6f3;--surface:#ffffff;--dark:#171717;--dark2:#292929;
 --blue:#20b95a;--blue2:#e9f8ee;--gold:#d6a43c;--gold2:#fff6df;
 --ink:#171a18;--muted:#747a75;--line:#e9eae6;--green:#20b95a;
 --red:#d95d5d;--shadow:0 10px 32px rgba(23,32,25,.045);--radius:22px;
 color:var(--ink);background:var(--bg)
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit}
button{transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(32,185,90,.25);outline-offset:2px}
.app{grid-template-columns:252px minmax(0,1fr);background:var(--bg)}
.side{background:#fff;color:#191c19;border-right:1px solid #e9eae6;padding:25px 15px 18px;gap:20px;box-shadow:3px 0 20px rgba(20,30,22,.018);z-index:5}
.brand{padding:2px 10px 8px;gap:12px}
.brand-mark{height:42px;width:42px;border-radius:15px;background:linear-gradient(145deg,#20c765 0%,#31d46c 48%,#b6e83b 100%);color:#102216;font-size:25px;letter-spacing:-2px;box-shadow:0 5px 13px rgba(32,185,90,.18)}
.brand strong{font-size:22px;letter-spacing:-.9px;color:#111}
.brand small{color:#8a908b;font-size:9px;letter-spacing:1.15px;font-weight:750}
.nav{display:grid;gap:3px;align-content:start;overflow-y:auto;padding:0 2px;scrollbar-width:thin}
.nav-label{font-size:9px;font-weight:800;letter-spacing:1.45px;color:#a0a49f;padding:13px 12px 5px}
.nav-label:not(:first-child){margin-top:7px;border-top:1px solid #f0f0ed;padding-top:14px}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;border:0;color:#5f665f;background:transparent;padding:10px 12px;border-radius:13px;font-size:12.5px;font-weight:650;min-height:40px}
.nav button:hover{background:#f4f7f4;color:#1b281f;transform:translateX(2px)}
.nav button.active{background:#e9f8ee;color:#147c3d;box-shadow:inset 3px 0 0 #24c45e}
.nav button.active .nicon{color:#159b48}
.nav .nicon{font-size:17px;width:22px;text-align:center;color:#858d85}
.side-footer{margin-top:auto;border-top:1px solid #eeefeb;padding:14px 10px 0;color:#858b85;font-size:10.5px;line-height:1.7}
.side-footer strong{color:#202520;font-size:12px}
.main{max-width:1500px;padding:38px clamp(22px,3.5vw,56px) 76px}
.top{align-items:center;margin-bottom:27px;padding-bottom:19px;border-bottom:1px solid #e9eae6;gap:18px}
.eyebrow{color:#1ba451;font-size:9px;letter-spacing:1.8px;font-weight:850;margin-bottom:9px}
.top h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(31px,3vw,40px);letter-spacing:-1.45px;line-height:1.08;margin:0;font-weight:700;color:#111}
.sub{color:#7b817b;font-size:13.5px;line-height:1.65;margin:9px 0 0;max-width:680px}
.top-right{gap:8px;align-items:center}
.grid{gap:17px}
.panel,.stat,.plan-card,.learn-run,.learn-source-summary,.plan-intro>.panel{background:#fff;border:1px solid #e9eae6;border-radius:22px;box-shadow:var(--shadow)}
.panel{padding:22px}
.panel-head{gap:12px;margin-bottom:17px;align-items:center}
.panel-head h2,.panel h2{font-size:16px;font-weight:760;letter-spacing:-.35px;color:#191d19}
.stat{padding:20px 21px;min-height:142px;transition:transform .2s ease,box-shadow .2s ease}
.stat:hover,.panel:hover{box-shadow:0 13px 34px rgba(25,40,29,.06)}
.stat .head{color:#777e78;font-size:11px;font-weight:700;letter-spacing:.1px}
.stat .num{font-size:34px;letter-spacing:-1.8px;font-weight:800;color:#111;margin:12px 0 5px}
.stat .foot{color:#8a908b;font-size:10.5px}
.btn{background:#22c55e;color:#fff;border:1px solid #22c55e;border-radius:999px;padding:10px 17px;font-size:12px;font-weight:760;box-shadow:0 3px 0 #159b49;min-height:39px}
.btn:hover{background:#18b653;border-color:#18b653;transform:translateY(-1px);box-shadow:0 4px 0 #138e42}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #138e42}
.btn.secondary{background:#fff;color:#292d29;border:1px solid #e5e7e2;box-shadow:0 2px 0 #e9eae6}
.btn.secondary:hover{background:#f8faf8;border-color:#cfd8d0;box-shadow:0 3px 0 #e0e5df}
.btn.ghost{background:transparent;border-color:transparent;color:#5d665e;box-shadow:none}
.btn.ghost:hover{background:#f2f6f2;color:#1d3826;box-shadow:none}
.btn.danger{background:#fff3f2;color:#b54747;border-color:#f3d9d7;box-shadow:0 2px 0 #f0e2e0}
.btn.slim{min-height:31px;padding:6px 12px;font-size:10.5px}
.tag,.pill{border-radius:999px;padding:5px 9px;font-size:10px;font-weight:750;letter-spacing:.05px}
.tag{background:#f0f2ef;color:#667067}
.tag.ok,.tag.success{background:#e8f8ed;color:#167a3c}
.tag.warn{background:#fff5df;color:#986a16}
.tag.danger{background:#fff0ef;color:#b84c49}
.tag.tae{background:#edf2ff;color:#4b63a6}
.tag.fisica{background:#fff4df;color:#a07322}
.pill{background:#eaf8ee;color:#167a3c}
.filter-tabs{display:flex;align-items:center;gap:5px;background:#f1f2ef;padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow:auto}
.filter-tabs button{border:0;background:transparent;color:#737a73;padding:7px 14px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.filter-tabs button.active{background:#fff;color:#1a6f39;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.field label{font-size:11px;font-weight:700;color:#535b54;margin-bottom:6px}
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{border:1px solid #e3e6e1;border-radius:13px;background:#fff;color:#202520;padding:11px 13px;font-size:12px;min-height:42px;box-shadow:none}
input:not([type=checkbox]):not([type=radio]):not([type=range]):focus,select:focus,textarea:focus{border-color:#62ce87;box-shadow:0 0 0 3px rgba(32,185,90,.09);outline:0}
textarea{line-height:1.55;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:#20b95a}
.notice,.soft-box,.guide{background:#f4f8f4;border:1px solid #e7efe7;border-radius:15px;color:#59665b;padding:13px 15px;font-size:11px;line-height:1.6}
.empty{border:1px dashed #dfe5df;background:#fafbf9;border-radius:16px;padding:23px;color:#8a918a;text-align:center;font-size:12px}
.list-card,.list-compact,.topic-mini,.priority-row{border-bottom:1px solid #f0f1ee;padding:12px 2px}
.list-card:last-child,.list-compact:last-child,.topic-mini:last-child{border-bottom:0}
.list-card p,.list-compact small,.topic-mini small{color:#8a908a}
.progress-part b{color:#1b9a4b}
.minibar,.plan-progress{background:#edf0ec;border-radius:999px;overflow:hidden}
.minibar i,.plan-progress i{background:linear-gradient(90deg,#20bd5c,#8bdd49);border-radius:999px}
.heatmap .cell,.streak-dots span,.streak-dot{border-radius:4px}
.database{border:1px solid #e9eae6;border-radius:17px;overflow:hidden;background:#fff}
.database-scroll{border-radius:17px}
.notion-table{border-collapse:separate;border-spacing:0;background:#fff}
.notion-table th{background:#f7f8f6;color:#747d75;font-size:10px;letter-spacing:.25px;text-transform:none;border-bottom:1px solid #e9eae6}
.notion-table td{border-bottom:1px solid #f0f1ee;color:#424a43;font-size:11px}
.notion-table tbody tr:hover{background:#fbfdfb}
.notion-table tbody tr:last-child td{border-bottom:0}
.modal{border:1px solid #e7eae5;border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.17)}
.modal-backdrop{background:rgba(20,25,21,.34);backdrop-filter:blur(5px)}
.flashcard{background:#fff;border:1px solid #e7eae5;border-radius:26px;box-shadow:0 13px 38px rgba(20,35,22,.055);min-height:300px}
.flashcard.is-revealed{background:#fff;border-color:#d9eadc}
.review-question{font-size:20px;line-height:1.55;color:#171b17}
.review-answer{border-top:1px solid #edf0ec;margin-top:24px;padding-top:20px;line-height:1.65}
.grade{border-radius:16px;border:1px solid #e7eae5;background:#fff;box-shadow:0 2px 0 #edf0ec;color:#202620;padding:12px 8px}
.grade:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(20,35,22,.07)}
.grade.good,.grade.easy{border-color:#cdebd6;background:#f0fbf3}
.grade.again{border-color:#f2d8d6;background:#fff6f5}
.grade.hard{border-color:#f1e5c8;background:#fffaf0}
.learn-source-summary{padding:21px 23px}
.learn-counts>div{background:#f7f8f6;border:1px solid #edf0eb;border-radius:16px;padding:15px}
.learn-counts strong{font-size:27px;color:#171b17}
.learn-counts span{color:#7b837c}
.learn-method-grid{gap:15px}
.learn-method{border:1px solid #e9eae6;border-radius:21px;padding:21px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.learn-method:hover{transform:translateY(-3px);border-color:#ccebd5;box-shadow:0 13px 30px rgba(24,48,29,.06)}
.learn-icon{height:42px;width:42px;border-radius:14px;background:#e9f8ee;color:#169847;display:grid;place-items:center;font-size:20px}
.learn-method h2{margin:13px 0 7px}
.learn-method p{color:#7c847d;line-height:1.65}
.learn-run-wrap{max-width:850px;margin:25px auto 0}
.learn-run{padding:clamp(22px,4vw,38px);border-radius:26px}
.learn-run h2{font-family:Georgia,"Times New Roman",serif;font-size:28px;letter-spacing:-.7px;color:#151815;margin:16px 0 10px}
.learn-question-text{background:#f7f8f6;border:1px solid #ecefea;border-radius:18px;padding:21px;font-size:17px;line-height:1.65;color:#202520}
.learn-own-response,.learn-reference{border-radius:17px;padding:17px;background:#f7f8f6;border:1px solid #edf0eb}
.learn-reference{background:#f1faf3;border-color:#e0f1e4}
.learn-option{border:1px solid #e7eae5;border-radius:15px;padding:14px;background:#fff}
.learn-option:has(input:checked){border-color:#45c874;background:#f0fbf3;box-shadow:0 0 0 2px rgba(32,185,90,.07)}
.learn-history-row{border-bottom:1px solid #eff1ed;padding:12px 2px}
.learn-history-row:last-child{border-bottom:0}
.plan-intro{gap:16px}
.plan-card{padding:20px;transition:transform .18s ease,box-shadow .18s ease}
.plan-card:hover{transform:translateY(-2px);box-shadow:0 13px 32px rgba(20,35,22,.06)}
.tree-line{border-radius:13px;padding:10px 11px}
.tree-line:hover{background:#f4faf5}
.tree-check{accent-color:#20b95a}
.origin-tag{border-radius:999px}
.plan-day{border:1px solid #e9eae6;border-radius:17px;padding:16px;background:#fff}
.plan-topic{border-radius:12px;padding:10px}
.plan-topic:hover{background:#f3faf5}
.plan-topic.done{background:#eef9f1}
.footer{color:#a0a69f;font-size:10px;padding-top:30px;text-align:center;letter-spacing:.2px}
#toast{border-radius:999px;background:#1d2a20;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
@media(max-width:770px){
 .app{display:block}
 .side{position:sticky;top:0;height:auto;max-width:100vw;overflow:visible;padding:9px 10px 8px;border-right:0;border-bottom:1px solid #e7e9e4;box-shadow:0 5px 18px rgba(20,30,22,.04);gap:5px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px)}
 .brand{padding:2px 5px 6px;gap:9px}
 .brand-mark{height:31px;width:31px;border-radius:11px;font-size:19px}
 .brand strong{font-size:18px}
 .brand small{font-size:8px}
 .nav{display:flex;min-width:0;gap:3px;overflow-x:auto;overflow-y:hidden;padding:2px 0 4px;scrollbar-width:none}
 .nav::-webkit-scrollbar{display:none}
 .nav-label{display:none}
 .nav button{font-size:10px;min-width:max-content;padding:8px 10px;gap:6px;min-height:34px;border-radius:999px}

function dashboard(){const s=flashStats(),progress=topicsData(),p=forecast(7),due=sessionsCandidates().length,lec=db.concepts.filter(leech);const counts=activityMap(),days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return {key:dateKey(d),n:counts.get(dateKey(d))||0}});const issues=progress.slice(0,3);
 return viewHead('Painel','Acompanhe memória, aplicação e constância em TAE e Física.',`<button class="btn secondary" data-view="learn">Aprender</button><button class="btn secondary" data-view="import">⇧ Importar</button><button class="btn" data-view="review">Começar revisão →</button>`)+`

 <section class="panel col7"><div class="panel-head"><h2>Mapa de constância · 12 semanas</h2><span class="tag">Atividade registrada</span></div>${heatmap()}<p class="tiny">Os bloquinhos refletem revisões, questões ou registros de erros. Clique para inspecionar um dia.</p></section>
 <section class="panel col5"><div class="panel-head"><h2>Agenda de estudo</h2><button class="btn secondary slim" data-view="planner">Abrir planejamento ↗</button></div><div class="priority-row"><strong>${db.concepts.filter(c=>isPublished(c)&&c.fsrs.due<=now()).length}</strong><span>flashcards para recuperar</span></div><div class="priority-row"><strong>${db.errors.filter(e=>e.status!=='dominado'&&e.nextReview<=now()).length}</strong><span>lacunas para aplicar em novas questões</span></div><div class="priority-row"><strong>${lec.length}</strong><span>conhecimentos com esquecimentos recorrentes</span></div><p class="tiny">Caderno de erros e flashcards têm calendários próprios, exibidos juntos.</p></section>
 <section class="panel col7"><div class="panel-head"><h2>Desempenho por assunto</h2><span class="tag">Questões resolvidas</span></div>${progress.length?progress.slice(0,7).map(x=>`<div class="topic-mini"><div><strong>${esc(x.topic)}</strong><small>${labelSub(x.subject)} · ${x.total} questões</small></div><div class="progress-part"><b>${fmtPct(x.correct,x.total)}</b><div class="minibar"><i style="width:${x.correct/x.total*100}%"></i></div></div></div>`).join(''):`<div class="empty">Seus assuntos aparecerão aqui após registrar questões.</div>`}</section>
 <section class="panel col5"><div class="panel-head"><h2>Onde retomar</h2><span class="tag">Diagnóstico</span></div>${issues.length?issues.map(x=>`<div class="list-compact"><strong>${esc(x.topic)}</strong><span>${fmtPct(x.correct,x.total)} de acertos</span></div>`).join(''):`<div class="empty">Registre questões para identificar assuntos prioritários.</div>`}<div class="soft-box">${lec.length?`${lec.length} conhecimento(s) repetidamente esquecido(s): revise a teoria e avalie a qualidade das perguntas.`:'Ainda não há conhecimentos com esquecimento recorrente.'}</div></section>
 <section class="panel col7"><div class="panel-head"><h2>Memória por tipo de cobrança</h2><span class="tag">Autoavaliação</span></div>${kindProgress()}</section>
 <section class="panel col5"><div class="panel-head"><h2>Próximos sete dias</h2><span class="tag">Revisões já agendadas</span></div>${forecastBars(p)}<p class="tiny">A previsão não inclui cartões que você criará ou futuras mudanças após revisões.</p></section>
<section class="panel col7"><div class="panel-head"><h2>Questões por semana · últimas 8</h2><span class="tag">Questões registradas</span></div>${weeklyChart()}</section>
<section class="panel col5"><div class="panel-head"><h2>Mapa de erros</h2><span class="tag">Causas registradas</span></div>${errorCauseChart()}</section>
<section class="panel col12"><div class="panel-head"><h2>Confiança × desempenho</h2><button class="btn secondary slim" data-action="new-confidence">+ Registrar confiança</button></div>${confidenceDashboard()}</section></div>`;
}
function kindProgress(){const m=new Map();for(const r of db.reviews.filter(r=>!r.preview)){let key=r.kind||'Outro',q=m.get(key)||{total:0,right:0};q.total++;q.right+=(r.grade!=='again')?1:0;m.set(key,q)}return m.size?[...m].sort((a,b)=>b[1].total-a[1].total).slice(0,7).map(([k,v])=>`<div class="topic-mini"><div><strong>${esc(k)}</strong><small>${v.total} respostas</small></div><div class="progress-part"><b>${fmtPct(v.right,v.total)}</b><div class="minibar"><i style="width:${v.right/v.total*100}%"></i></div></div></div>`).join(''):`<div class="empty">Após suas revisões, veremos se a dificuldade está em competências, comparação, lei seca ou aplicação.</div>`}
function forecastBars(rows){let max=Math.max(1,...rows.map(x=>x.due+x.errors));return `<div class="forecast">${rows.map(x=>`<div class="forecast-col" title="${x.due} cartões · ${x.errors} erros"><div class="forecast-stack"><i style="height:${Math.max(0,x.due/max*100)}%"></i><em style="height:${Math.max(0,x.errors/max*100)}%"></em></div><small>${x.label}</small></div>`).join('')}</div><div class="legend"><span><i class="leg-blue"></i> Flashcards</span><span><i class="leg-amber"></i> Questões</span></div>`}
function reviewScreen(){let list=selectReview();let head=viewHead('Revisão espaçada','FSRS-6 · uma formulação por família · registro por tipo de cobrança');const controls=`<div class="review-controls">${tabs(revFilter,'rev-filter')}<select id="session-choice" aria-label="Tipo de sessão"><option value="normal" ${session==='normal'?'selected':''}>Revisões do dia</option><option value="difficult" ${session==='difficult'?'selected':''}>Esquecimentos recorrentes</option><option value="law" ${session==='law'?'selected':''}>Lei seca e exceções</option><option value="kind" ${session==='kind'?'selected':''}>Por tipo de cobrança</option><option value="ahead" ${session==='ahead'?'selected':''}>Adiantamento (futuras sem reagendar)</option></select>${session==='kind'?`<select id="kind-choice" aria-label="Modalidade">${KINDS.map(k=>`<option value="${esc(k)}" ${extraKind===k?'selected':''}>${esc(k)}</option>`).join('')}</select>`:''}<span class="tag">${list.length} disponíveis</span></div>`;
 if(!card)return head+controls+`<section class="panel" style="max-width:700px;margin:24px auto;text-align:center;padding:48px 25px"><div class="success-symbol">✓</div><h2>Revisões em dia para esta sessão</h2><p class="muted">Se houver conteúdos novos ou vencidos além dos limites diários, ajuste-os em Planejamento.</p><div class="button-row" style="justify-content:center"><button class="btn secondary" data-view="planner">Planejamento</button><button class="btn" data-view="concepts">Meus cartões</button></div></section>`;
 let c=card,v=c.variants[variantIndex],future=session==='ahead'&&c.fsrs.due>now(),src=v.source||c.source;
 const text=v.format==='cloze'?clozeText(v.q,!shown):rich(v.q);
 const question=`<div class="review-question">${text}</div>`;
 const media=v.format==='image'&&v.image?`<div class="occlusion-wrap"><img src="${esc(v.image)}" alt="Imagem do flashcard"><span class="mask-overlay ${shown?'visible-mask':''}" style="left:${clamp(v.mask?.x||15,0,99)}%;top:${clamp(v.mask?.y||20,0,99)}%;width:${clamp(v.mask?.w||35,1,100)}%;height:${clamp(v.mask?.h||18,1,100)}%">${shown?'':'?'}</span></div>`:'';
 return head+controls+`<section class="card-area"><div class="review-meta"><span class="tag ${c.subject}">${labelSub(c.subject)}</span><span>${esc(c.topic)}</span><span class="tag">${esc(v.kind)} · ${esc(v.format||'basic')}</span></div><div class="flashcard ${shown?'is-revealed':''}" data-action="reveal" tabindex="0" role="button" aria-label="Revelar resposta">${question}${media}${v.format==='typed'&&!shown?`<div class="typed-answer"><input id="typed-value" autocomplete="off" placeholder="Digite sua resposta antes de revelar" value="${esc(typedValue)}"><span>Compare sua resposta após revelar</span></div>`:''}${shown?`<div class="review-answer"><div class="tiny">RESPOSTA</div><div>${rich(v.a)}</div>${v.format==='typed'?`<div class="typed-result">Sua resposta: <strong>${esc(typedValue||'—')}</strong> · ${normalize(typedValue)===normalize(v.a)?'Texto correspondente':'Confira equivalências e o raciocínio antes de avaliar'}</div>`:''}${v.reason?`<p class="muted"><strong>Justificativa:</strong> ${rich(v.reason)}</p>`:''}${src?`<p class="tiny">Fonte informada: ${esc(src)}</p>`:''}</div>`:`<div class="tiny review-tap">Toque ou clique para revelar · espaço</div>`}</div>${shown?`<p class="muted" style="text-align:center;margin:16px 0 8px">${future?'Sessão antecipada: avaliação não altera os intervalos.':'Você se lembrou sem consultar a resposta?'}</p><div class="grade-grid">${[['again','Errei'],['hard','Difícil'],['good','Bom'],['easy','Fácil']].map(([g,t])=>{let preview=rateEngine(c.fsrs,g);return `<button class="grade ${g}" data-grade="${g}"><b>${t}</b><small>${future?'Prévia':previewLabel(preview.delay)}</small></button>`}).join('')}</div>`:`<div class="button-row" style="justify-content:center;margin-top:14px"><button class="btn" data-action="reveal">Mostrar resposta</button></div>`}<p class="tiny" style="text-align:center;margin-top:18px">${future?'Modo treino antecipado não interfere no FSRS.':'Errei significa que você não conseguiu recordar; Difícil significa que recordou com esforço.'} · Versão ${variantIndex+1}/${c.variants.length}</p></section>`;
}
function recordRate(g){if(!card||!shown)return;let c=card,v=c.variants[variantIndex],future=session==='ahead'&&c.fsrs.due>now(),before={...c.fsrs};if(!future)c.fsrs=rateEngine(c.fsrs,g);else previewedIds.add(c.id);v.uses++;v.passes+=g==='again'?0:1;v.failures+=g==='again'?1:0;c.lastVariant=v.id;
 db.reviews.push({id:uid(),conceptId:c.id,subject:c.subject,topic:c.topic,variantId:v.id,kind:v.kind,format:v.format||'basic',grade:g,at:now(),wasNew:!before.reps,preview:future,typed:typedValue,s:future?before.s:c.fsrs.s,d:future?before.d:c.fsrs.d,due:future?before.due:c.fsrs.due});
 if(!future&&leech(c)&&c.fsrs.lapses===db.settings.leech)notify('Esquecimentos recorrentes: abra Flashcards para revisar a qualidade deste conceito.');
 save();card=null;shown=false;typedValue='';render();}
function conceptScreen(){const all=db.concepts.filter(c=>filter==='all'||c.subject===filter).sort((a,b)=>a.topic.localeCompare(b.topic));return viewHead('Flashcards','Cada família concentra até 10 versões de um mesmo microconhecimento.',`<button class="btn" data-action="new-concept">+ Nova família</button>`)+`<div class="stack">${tabs()}<div class="database"><div class="database-scroll"><table class="notion-table"><thead><tr><th>Conhecimento</th><th>Área</th><th>Versões</th><th>FSRS · revisão</th><th>Esquecimentos</th><th>Estado</th><th>Ações</th></tr></thead><tbody>${all.length?all.map(c=>`<tr><td><strong>${cleanTitle(c.topic)}</strong><div class="tiny">${esc(c.source||'Sem fonte cadastrada')}</div></td><td><span class="tag ${c.subject}">${labelSub(c.subject)}</span></td><td>${activeVariants(c).length}/${c.variants.length}</td><td>${c.status==='published'?formatLate(c.fsrs.due):'—'}</td><td>${c.fsrs.lapses}${leech(c)?' <span class="tag warn">Reformular?</span>':''}</td><td>${c.suspended?'<span class="tag warn">Suspenso</span>':c.status==='draft'?'<span class="tag warn">Curadoria</span>':'<span class="tag ok">Publicado</span>'}</td><td><div class="cell-actions"><button data-action="inspect-concept" data-id="${c.id}" title="Histórico">◷</button><button data-action="edit-concept" data-id="${c.id}" title="Editar">✎</button><button data-action="toggle-suspend" data-id="${c.id}" title="Suspender / ativar">${c.suspended?'↺':'Ⅱ'}</button><button data-action="delete-concept" data-id="${c.id}" title="Excluir">×</button></div></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Sem famílias cadastradas.</td></tr>`}</tbody></table></div></div><div class="guide">O FSRS agenda cada microconhecimento. Os acertos de cada versão e modalidade são guardados individualmente; versões adicionais não multiplicam a carga.</div></div>`}
function practiceScreen(){const b=db.blocks.filter(x=>filter==='all'||x.subject===filter).sort((x,y)=>y.at-x.at);return viewHead('Questões','Desempenho em provas e listas, separado da memória dos flashcards.',`<button class="btn" data-action="new-block">+ Registrar questões</button>`)+`<div class="stack">${tabs()}<div class="panel"><div class="panel-head"><h2>Histórico de resoluções</h2><span class="tag">${b.length} blocos</span></div>${b.length?b.map(x=>`<div class="list-card"><div><strong>${cleanTitle(x.topic)}</strong><p>${labelSub(x.subject)} · ${dateLabel(x.at)} · ${x.total} questões · ${fmtPct(x.correct,x.total)} de acertos${x.note?'<br>'+esc(x.note):''}</p></div><button class="btn ghost slim" data-action="delete-block" data-id="${x.id}">×</button></div>`).join(''):`<div class="empty">Registre blocos de questões para acompanhar a aplicação dos conteúdos.</div>`}</div></div>`}
function errorScreen(){const list=db.errors.filter(x=>filter==='all'||x.subject===filter).sort((a,b)=>b.at-a.at),due=list.filter(x=>x.status!=='dominado'&&x.nextReview<=now()).length;return viewHead('Caderno de erros','Seu banco do Notion, agora com agenda de reaplicação e histórico.',`<button class="btn" data-action="new-error">+ Novo erro</button>`)+`<div class="stack">${tabs()}<div class="row-between"><span class="muted">${list.length} registros · ${due} questões para retomar</span><button class="btn secondary slim" data-view="planner">Ver agenda conjunta →</button></div><div class="database"><div class="database-scroll"><table class="notion-table"><thead><tr><th>Data</th><th>Tipo</th><th>Disciplina</th><th>Área</th><th>Assunto</th><th>Erro / lacuna</th><th>Correção</th><th>Revisão</th><th>Próxima data</th><th>Flashcard</th><th>URL questão</th><th>Ações</th></tr></thead><tbody>${list.length?list.map(e=>`<tr><td>${dateLabel(e.at)}</td><td><span class="tag">${esc(e.type||e.cause)}</span></td><td><span class="tag ${e.subject}">${esc(e.discipline||labelSub(e.subject))}</span></td><td>${esc(e.area||'—')}</td><td>${esc(e.topic)}</td><td class="long">${e.questionText?`<details class="error-q-preview"><summary>Ver enunciado original</summary><p>${rich(e.questionText)}</p>${e.optionsText?`<p>${rich(e.optionsText)}</p>`:''}${e.correctAnswer?`<p class="tiny">Gabarito cadastrado: ${esc(e.correctAnswer)}</p>`:''}</details>`:''}${rich(e.mistake)}</td><td class="long">${rich(e.fix)}</td><td><span class="tag">${e.reviewDays}d</span><div class="tiny">${e.successes||0} acerto(s)</div></td><td>${e.status==='dominado'?'<span class="tag ok">Dominado</span>':e.nextReview<=now()?'<span class="tag warn">Agora</span>':dateLabel(e.nextReview)}</td><td>${e.conceptId?`<span class="tag">${cleanTitle(db.concepts.find(c=>c.id===e.conceptId)?.topic||'Não encontrado')}</span>`:'—'}</td><td>${safeUrl(e.questionUrl)?`<a href="${esc(safeUrl(e.questionUrl))}" target="_blank" rel="noopener noreferrer function plannerScreen(){const forecastRows=forecast(14),dueCards=db.concepts.filter(c=>isPublished(c)&&c.fsrs.due<=now()).sort((a,b)=>a.fsrs.due-b.fsrs.due),dueErrors=db.errors.filter(e=>e.status!=='dominado'&&e.nextReview<=now()).sort((a,b)=>a.nextReview-b.nextReview),flags=db.concepts.filter(c=>!c.suspended&&leech(c));return viewHead('Revisões','Uma agenda para recordação (FSRS) e aplicação (caderno de erros).',`<button class="btn secondary" data-view="plans">Editais e planos</button><button class="btn" data-view="review">▤ Revisar agora</button>`)+`<div class="grid"><section class="panel col7"><div class="panel-head"><h2>Previsão · 14 dias</h2><span class="tag">Agendamentos reais</span></div>${forecastBars(forecastRows)}<p class="tiny">Previsão das revisões já marcadas: não é simulação de respostas futuras. Novos cartões ou revisões realizadas modificam este gráfico.</p></section><section class="panel col5"><div class="panel-head"><h2>Capacidade diária</h2><span class="tag">Limites configuráveis</span></div><form id="limits-form"><div class="form-row"><div class="field"><label>Novas famílias/dia</label><input name="new" type="number" min="0" max="200" value="${db.settings.newLimit}" required></div><div class="field"><label>Revisões antigas/dia</label><input name="reviews" type="number" min="1" max="1000" value="${db.settings.reviewLimit}" required></div></div><button class="btn secondary" type="submit">Salvar limites</button></form><p class="tiny">As revisões em atraso não são apagadas; apenas ficam para outra sessão.</p></section>
<section class="panel col7"><div class="panel-head"><h2>Flashcards que venceram</h2><span class="tag">${dueCards.length}</span></div>${dueCards.length?dueCards.slice(0,12).map(c=>`<div class="list-compact"><span><strong>${esc(c.topic)}</strong><small>${labelSub(c.subject)} · ${isNew(c)?'Primeira revisão':Math.round((retrievability(c.fsrs)||0)*100)+'% lembrança estimada'}</small></span><button class="btn ghost slim" data-action="focus-concept" data-id="${c.id}">Estudar →</button></div>`).join(''):`<div class="empty">Nenhuma família vencida.</div>`}</section>
<section class="panel col5"><div class="panel-head"><h2>Questões para reaplicar</h2><span class="tag">${dueErrors.length}</span></div>${dueErrors.length?dueErrors.slice(0,10).map(e=>`<div class="list-compact"><span><strong>${esc(e.topic)}</strong><small>${esc(e.type)} · ${dateLabel(e.nextReview)}</small></span><button class="btn ghost slim" data-action="apply-error" data-id="${e.id}">Avaliar →</button></div>`).join(''):`<div class="empty">Nenhuma reaplicação vencida.</div>`}</section>

function planNode(raw,depth=0){const name=String(raw?.name??raw?.nome??raw?.title??raw?.titulo??raw?.assunto??raw?.disciplina??raw?.topico??'').trim();if(!name)return null;let children=raw.children??raw.filhos??raw.assuntos??raw.subassuntos??raw.topicos??raw.items??[];if(!Array.isArray(children))children=[];const origin=String(raw.origin??raw.origem??'edital').toLowerCase();const normalizedOrigin=/suggest|sugest|desdob|complement/i.test(origin)?'suggested':/manual|usuario|usuário/i.test(origin)?'manual':'edital';return {id:uid(),name:name.slice(0,240),origin:normalizedOrigin,sourceRef:String(raw.sourceRef??raw.referencia??raw.pagina??raw.fonte??'').slice(0,180),sourceText:String(raw.sourceText??raw.textoOriginal??raw.texto_original??'').slice(0,1200),selected:raw.selected!==undefined?!!raw.selected:raw.selecionado!==undefined?!!raw.selecionado:normalizedOrigin!=='suggested',collapsed:false,children:children.map(x=>planNode(x,depth+1)).filter(Boolean)}}
function normalizeVerticalization(raw){if(typeof raw==='string')raw=JSON.parse(raw);const meta=raw.metadata||raw.metadados||{};let nodes=raw.disciplines||raw.disciplinas||raw.tree||raw.conteudos||raw.conteúdo_programatico||raw.conteudo_programatico||[];if(!Array.isArray(nodes)&&Array.isArray(nodes.items))nodes=nodes.items;if(!Array.isArray(nodes))throw Error('Não encontrei uma lista de disciplinas no JSON.');const tree=nodes.map(x=>planNode(x)).filter(Boolean);if(!tree.length)throw Error('A estrutura não contém disciplinas ou tópicos reconhecíveis.');return {tree,warnings:Array.isArray(raw.warnings)?raw.warnings:Array.isArray(raw.alertas)?raw.alertas:[],meta}}
function findPlanNode(nodes,id){for(const n of nodes||[]){if(n.id===id)return n;const f=findPlanNode(n.children,id);if(f)return f}return null}
function updatePlanNode(nodes,id,fn){for(const n of nodes||[]){if(n.id===id){fn(n);return true}if(updatePlanNode(n.children,id,fn))return true}return false}
function removePlanNode(nodes,id){for(let i=0;i<(nodes||[]).length;i++){if(nodes[i].id===id){nodes.splice(i,1);return true}if(removePlanNode(nodes[i].children,id))return true}return false}
function setNodeSelected(n,value){n.selected=value;(n.children||[]).forEach(x=>setNodeSelected(x,value))}
function nodeSelectionState(n){const children=n.children||[];if(!children.length)return {all:!!n.selected,some:!!n.selected};const states=children.map(nodeSelectionState);return {all:states.every(x=>x.all),some:states.some(x=>x.some)}}
function syncNodeSelection(nodes){for(const n of nodes||[]){if(n.children?.length){syncNodeSelection(n.children);n.selected=n.children.every(x=>nodeSelectionState(x).all)}}}
function selectedPlanLeaves(nodes,path=[]){let out=[];for(const n of nodes||[]){const next=[...path,n.name];if(n.children?.length)out.push(...selectedPlanLeaves(n.children,next));else if(n.selected)out.push({id:n.id,name:n.name,path:next,origin:n.origin,sourceRef:n.sourceRef})}return out}
function treeNodeCount(nodes){return (nodes||[]).reduce((a,n)=>a+1+treeNodeCount(n.children),0)}
function renderPlanNode(n,depth=0){const state=nodeSelectionState(n),originLabel=n.origin==='suggested'?'Sugestão IA':n.origin==='manual'?'Manual':'Edital';return `<div class="tree-node"><div class="tree-line"><input class="tree-check" type="checkbox" data-tree-select="${n.id}" ${state.all?'checked':''} ${state.some&&!state.all?'data-partial="true"':''} aria-label="Selecionar ${esc(n.name)}"><button class="tree-expand ${n.children?.length?'':'empty-expand'}" data-action="toggle-plan-node" data-id="${n.id}" type="button">${n.children?.length?(n.collapsed?'＋':'−'):'·'}</button><span class="tree-name">${esc(n.name)}</span><span class="origin-tag ${n.origin}">${originLabel}</span>${n.sourceRef?`<span class="tree-ref" title="${esc(n.sourceRef)}">${esc(n.sourceRef)}</span>`:''}<div class="tree-actions"><button type="button" data-action="add-plan-child" data-id="${n.id}" title="Adicionar subitem">＋</button><button type="button" data-action="edit-plan-node" data-id="${n.id}" title="Editar">✎</button><button type="button" data-action="delete-plan-node" data-id="${n.id}" title="Excluir">×</button></div></div>${n.sourceText?`<details class="tree-source"><summary>Ver trecho original do edital</summary><p>${esc(n.sourceText)}</p></details>`:''}${n.children?.length&&!n.collapsed?`<div class="tree-children">${n.children.map(x=>renderPlanNode(x,depth+1)).join('')}</div>`:''}</div>`}
function applyTreeIndeterminate(){document.querySelectorAll('[data-tree-select]').forEach(el=>{const n=findPlanNode(db.planDraft?.tree,el.dataset.treeSelect);if(n){const st=nodeSelectionState(n);el.indeterminate=st.some&&!st.all}})}
function plansScreen(){const plans=db.plans||[],draft=db.planDraft;return viewHead('Editais e planos','Transforme o conteúdo programático em uma estrutura que você seleciona, edita e transforma no seu próprio plano.',`<button class="btn" data-action="new-plan">＋ Novo plano</button>`)+`<div class="plan-intro"><section class="panel"><div class="panel-head"><h2>Verticalizar um edital</h2><span class="tag">IA opcional</span></div><p class="muted">Envie o edital, identifique o cargo e organize o conteúdo programático em disciplinas, assuntos e subassuntos. Depois, escolha o que entra no seu plano.</p><div class="button-row"><button class="btn" data-action="new-plan">Começar com um edital</button><button class="btn secondary" data-action="new-manual-plan">Criar plano manualmente</button></div></section><section class="panel"><div class="panel-head"><h2>Como funciona</h2></div><div class="topic-mini"><strong>1. Importar</strong><small>PDF ou texto do edital</small></div><div class="topic-mini"><strong>2. Verticalizar</strong><small>IA assistida ou organização manual</small></div><div class="topic-mini"><strong>3. Selecionar</strong><small>Marque, edite e reorganize</small></div><div class="topic-mini"><strong>4. Planejar</strong><small>Distribua seus estudos na semana</small></div></section></div>${draft?`<section class="panel" style="margin-top:15px"><div class="row-between"><div><h2>Rascunho em andamento</h2><p class="muted">${esc(draft.meta?.title||'Plano sem título')} · ${treeNodeCount(draft.tree||[])} item(ns) verticalizados</p></div><button class="btn secondary" data-view="verticalizer">Continuar rascunho →</button></div></section>`:''}<section class="panel" style="margin-top:15px"><div class="panel-head"><h2>Meus planos</h2><span class="tag">${plans.length} salvo(s)</span></div>${plans.length?`<div class="stack">${plans.map(p=>{const leaves=selectedPlanLeaves(p.tree||[]),done=(p.assignments||[]).filter(x=>x.done).length;return `<article class="plan-card"><div class= function planTopicMetrics(name){const key=normalize(name),matches=value=>{const v=normalize(value);return v===key||v.startsWith(key+' ')||key.startsWith(v+' ')};const blocks=db.blocks.filter(b=>matches(b.topic)),errors=db.errors.filter(e=>matches(e.topic)),concepts=db.concepts.filter(c=>matches(c.topic));return {questions:blocks.reduce((a,b)=>a+b.total,0),correct:blocks.reduce((a,b)=>a+b.correct,0),errors:errors.length,cards:concepts.length}}
function planDetailScreen(){const p=(db.plans||[]).find(x=>x.id===activePlanId);if(!p)return plansScreen();const leaves=selectedPlanLeaves(p.tree||[]),assignments=p.assignments||[],done=assignments.filter(x=>x.done).length,days=WEEKDAYS;return viewHead(p.meta?.title||'Meu plano','Plano salvo · conteúdos, calendário e acompanhamento.',`<button class="btn secondary" data-view="plans">← Meus planos</button><button class="btn" data-action="edit-plan" data-id="${p.id}">Editar plano</button>`)+`<section class="panel"><div class="row-between"><div><h2>${esc(p.meta?.cargo||'Cargo não informado')}</h2><p class="muted">${esc(p.meta?.institution||'')} ${p.meta?.organizer?'· '+esc(p.meta.organizer):''}</p></div><span class="tag">${leaves.length} tópicos</span></div><div class="plan-progress" style="margin-top:14px"><i style="width:${leaves.length?done/leaves.length*100:0}%"></i></div><p class="tiny">${done} de ${leaves.length} tópicos marcados como estudados · Início: ${p.scheduleConfig?.startDate?dateLabel(dateFromInput(p.scheduleConfig.startDate)):'não definido'} · ${p.meta?.examDate?'Prova: '+dateLabel(dateFromInput(p.meta.examDate)):'Sem data de prova definida'}</p></section><section class="panel" style="margin-top:15px"><div class="panel-head"><h2>Distribuição semanal</h2><span class="tag">${p.scheduleConfig?.minutes||90} min/dia disponíveis</span></div><div class="grid">${days.filter(day=>assignments.some(a=>Number(a.day)===day.id)).map(day=>`<div class="plan-day col6"><h3>${day.label}</h3>${assignments.filter(a=>Number(a.day)===day.id).map(a=>`<label class="plan-topic ${a.done?'done':''}"><input type="checkbox" data-plan-done="${a.nodeId}" ${a.done?'checked':''}><span><strong>${esc(a.name)}</strong><small>${esc((a.path||[]).slice(0,-1).join(' › '))}</small></span></label>`).join('')}</div>`).join('')}</div></section><section class="panel" style="margin-top:15px"><div class="panel-head"><h2>Conteúdos e evidências de estudo</h2><span class="tag">Vínculos por nome de assunto</span></div>${leaves.map(x=>{const m=planTopicMetrics(x.name);return `<div class="topic-mini"><div><strong>${esc(x.name)}</strong><small>${esc(x.path.slice(0,-1).join(' › '))} · ${m.cards} família(s) de flashcards · ${m.errors} erro(s)</small></div><div class="progress-part"><b>${m.questions?fmtPct(m.correct,m.questions):'Sem questões'}</b><div class="tiny">${m.questions} questão(ões)</div></div></div>`}).join('')}</section>`}
function buildVerticalPrompt(){const d=db.planDraft;if(!d)return '';const m=d.meta||{};return `Você é especialista em análise de editais de concursos públicos e organização de conteúdo programático. Verticalize SOMENTE o conteúdo do cargo/área indicado abaixo.\n\nCONCURSO/PLANO: ${m.title||''}\nINSTITUIÇÃO: ${m.institution||''}\nCARGO: ${m.cargo||''}\nÁREA/RECORTE: ${m.area||''}\nBANCA: ${m.organizer||'não informada'}\n\nREGRAS OBRIGATÓRIAS:\n1. Identifique apenas o conteúdo programático pertinente ao cargo/área selecionado. Não misture conteúdos de outros cargos.\n2. Preserve literalmente os itens expressos no edital. Organize em hierarquia: disciplina > área/eixo > assunto > subassunto, conforme o texto permitir.\n3. Não invente assuntos e não apresente conhecimento geral como se estivesse no edital.\n4. Quando um item amplo precisar de desdobramento para facilitar o estudo, coloque os filhos com origin="suggested" e mantenha o texto original do edital no nó-pai. Sugestões devem começar desmarcadas.\n5. Para cada nó literal, informe sourceRef (página, anexo, seção ou item) e sourceText com o trecho original, se disponível. Não invente páginas.\n6. Se o cargo, a área ou a seção do conteúdo programático não estiverem claros, registre a dúvida em warnings. Não adivinhe.\n7. Retorne APENAS JSON válido, sem Markdown, seguindo exatamente esta estrutura:\n{\n  "format": "ritmo-edital-v1",\n  "metadata": {"cargo": "...", "area": "..."},\n  "disciplines": [\n    {"name": "...", "origin": "edital", "sourceRef": "...", "sourceText": "...", "children": [\n      {"name": "...", "origin": "edital", "sourceRef": "...", "sourceText": "...", "children": [\n        {"name": "...", "origin": "suggested", "sourceRef": "", "sourceText": "", "children": []}\n      ]}\n    ]}\n  ],\n  "warnings": []\n}\n\nCONTEÚDO EXTRAÍDO DO EDITAL (páginas identificadas quando disponíveis):\n${(d.sourceText||'').slice(0,160000)}\n\nSe o texto estiver incompleto ou não trouxer o conteúdo programático, informe isso em warnings e não fabrique a verticalização.`}
function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>notify('Solicitação copiada. Cole no ChatGPT para gerar a estrutura.')).catch(()=>fallbackCopy(text));}else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');notify('Solicitação copiada. Cole no ChatGPT para gerar a estrutura.')}catch(e){download('ritmo_solicitacao_verticalizacao.txt',text,'text/plain;charset=utf-8');notify('Não foi possível copiar; baixei a solicitação em TXT.')}t.remove()}
function importVerticalJson(text){const clean=String(text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const raw=JSON.parse(clean);const norm=normalizeVerticalization(raw);const d=db.planDraft;if(!d)throw Error('Crie um rascunho de plano primeiro.');d.tree=norm.tree;d.warnings=norm.warnings;d.meta={...d.meta,...Object.fromEntries(Object.entries(norm.meta||{}).filter(([k,v])=>v&&typeof v==='string'))};d.stage='tree';save();render();notify(`${treeNodeCount(d.tree)} itens importados. Sugestões da IA ficaram desmarcadas.`)}
async function loadPdfJs(){if(window.pdfjsLib)return window.pdfjsLib;await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';script.onload=resolve;script.onerror=()=>reject(Error('Não consegui carregar o leitor de PDF. Use a opção de colar texto do edital.'));document.head.appendChild(script)});if(window.pdfjsLib?.GlobalWorkerOptions)window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return window.pdfjsLib}
async function readPlanFile(file){if(!file)return;if(file.size>25000000)throw Error('Arquivo acima de 25 MB.');const name=file.name||'edital';let text='';if(/\.pdf$/i.test(name)||file.type==='application/pdf'){const pdfjs=await loadPdfJs();const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),disableWorker:true}).promise;const pages=[];for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();const line=content.items.map(x=>x.str).filter(Boolean).join(' ').replace(/\s+/g,' ').trim();if(line)pages.push(`[Página ${i}]\n${line}`)}text=pages.join('\n\n');if(text.trim().length<80)throw Error('O PDF parece ser escaneado ou não contém texto selecionável. Use OCR ou cole o conteúdo programático no campo.')}else if(/\.(txt|md)$/i.test(name)||file.type.startsWith('text/'))text=await file.text();else throw Error('Formato não suportado. Envie PDF, TXT ou MD.');if(text.length>180000)text=text.slice(0,180000);db.planDraft.meta.sourceFile=name;db.planDraft.sourceText=text;save();const area=document.getElementById('plan-source-text');if(area)area.value=text;notify('Texto extraído. Confira se o cargo e o conteúdo programático estão corretos.');}
function plansScheduleAssignments(){const d=db.planDraft,leaves=selectedPlanLeaves(d.tree||[]),cfg=d.scheduleConfig||{},days=cfg.days||[];if(!leaves.length)return alert('Selecione ao menos um tópico.');if(!days.length)return alert('Selecione os dias disponíveis.');const old=new Map((d.assignments||[]).map(x=>[x.nodeId||x.id,x]));d.assignments=leaves.map((x,i)=>{const prev=old.get(x.id);const balanced=cfg.mode==='priority'?days[Math.min(days.length-1,Math.floor(i/Math.max(1,Math.ceil(leaves.length/days.length))))]:days[i%days.length];return {nodeId:x.id,name:x.name,path:x.path,origin:x.origin,sourceRef:x.sourceRef,day:prev&&days.includes(Number(prev.day))?Number(prev.day):balanced,done:prev?.done||false}});save();render();notify('Distribuição criada. Mude os dias de cada tópico antes de salvar.')}
function savePlan(){const d=db.planDraft;if(!d)return;if(!String(d.meta?.title||'').trim()||!String(d.meta?.cargo||'').trim()){alert('Informe o nome do plano e o cargo/área antes de salvar.');goto('verticalizer');return}const leaves=selectedPlanLeaves(d.tree||[]);if(!leaves.length)return alert('Selecione ao menos um conteúdo.');const assigned=new Set((d.assignments||[]).map(x=>x.nodeId));if(!d.assignments?.length||leaves.some(x=>!assigned.has(x.id))||d.assignments.length!==leaves.length)return alert('Distribua novamente os conteúdos na semana antes de salvar, para incluir todos os tópicos selecionados.');const id=d.editingId||uid();const plan={id,meta:d.meta,sourceFile:d.meta?.sourceFile||'',sourceText:d.sourceText||'',tree:d.tree, warnings:d.warnings||[],scheduleConfig:d.scheduleConfig,assignments:d.assignments,createdAt:d.createdAt||now(),updatedAt:now()};const ix=db.plans.findIndex(x=>x.id===id);if(ix>=0)db.plans[ix]=plan;else db.plans.push(plan);db.planDraft=null;activePlanId=id;save();goto('planDetail');notify('Plano salvo. Seus tópicos e sua distribuição foram registrados.')}
function planManualRoot(){if(!db.planDraft)newPlanDraft();planNodeModal('add-root')}
function planNodeModal(mode,id=''){const node=id?findPlanNode(db.planDraft?.tree,id):null;planNodeEditor={mode,id};const title=mode==='edit'?'Editar conteúdo':mode==='add-child'?'Adicionar subassunto':'Adicionar disciplina ou área',originValue=node?.origin||'manual';showModal(modalHeader(title)+`<form id="plan-node-form"><div class="field"><label>Nome do conteúdo *</label><input id="plan-node-name" required maxlength="240" value="${esc(node?.name||'')}" placeholder="Ex.: Organização da educação nacional"></div><div class="form-row"><div class="field"><label>Origem</label><select id="plan-node-origin"><option value="edital" ${originValue==='edital'?'selected':''}>Texto expresso no edital</option><option value="suggested" ${originValue==='suggested'?'selected':''}>Desdobramento sugerido pela IA</option><option value="manual" ${originValue==='manual'?'selected':''}>Adicionado manualmente</option></select></div><div class="field"><label>Referência no edital</label><input id="plan-node-ref" maxlength="180" value="${esc(node?.sourceRef||'')}" placeholder="Ex.: Anexo II, p. 35"></div></div><div class="field"><label>Trecho original (opcional)</label><textarea id="plan-node-source" rows="3" maxlength="1200" placeholder="Cole o trecho literal que fundamenta este item.">${esc(node?.sourceText||'')}</textarea></div><p class="tiny">Itens sugeridos pela IA começam desmarcados para não serem confundidos com o conteúdo expresso no edital.</p>${footerButtons('Salvar conteúdo')}</form>`)}
function planNodePrompt(id,mode){const d=db.planDraft;if(!d)return;const node=id?findPlanNode(d.tree,id):null;if(mode==='add'){const name=prompt('Nome do novo assunto/subassunto:');if(!name?.trim())return;const child={id:uid(),name:name.trim(),origin:'manual',sourceRef:'',sourceText:'',selected:true,collapsed:false,children:[]};if(node)node.children.push(child);else d.tree.push(child)}else if(mode==='edit'){if(!node)return;const name=prompt('Editar nome do conteúdo:',node.name);if(!name?.trim())return;node.name=name.trim()}else if(mode==='delete'){if(!node||!confirm(`Excluir "${node.name}" e seus subitens?`))return;removePlanNode(d.tree,id)}else if(mode==='toggle'){if(node)node.collapsed=!node.collapsed}else if(mode==='select'){(d.tree||[]).forEach(n=>setNodeSelected(n,true))}else if(mode==='clear'){(d.tree||[]).forEach(n=>setNodeSelected(n,false))}syncNodeSelection(d.tree);save();render()}

/* Aprender: experiências baseadas exclusivamente nas famílias de flashcards publicadas
   e nas questões/erros que o próprio estudante cadastrou. Não altera FSRS nem o agendamento do caderno. */
function learnModeLabel(mode){return ({explain:'Autoexplicação',recall:'Recuperação livre',error:'Retomar erro',interleave:'Prática intercalada'})[mode]||'Aprender'}
function learnConcepts(){return db.concepts.filter(c=>isPublished(c)&&activeVariants(c).length)}
function learnErrors(){return [...db.errors].sort((a,b)=>b.at-a.at)}
function parseErrorOptions(text){return String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((line,i)=>{const m=line.match(/^([A-E])\s*[\).:\-]\s*(.*)$/i);return {key:m?m[1].toUpperCase():String(i+1),text:m?m[2]:line}})}
function learnConceptOptions(id=''){const a=learnConcepts();return `<option value="">Escolha um conhecimento</option>${a.map(c=>`<option value="${c.id}" ${id===c.id?'selected':''}>${esc(labelSub(c.subject)+' · '+c.topic)}</option>`).join('')}`}
function learnErrorOptions(id=''){const a=learnErrors();return `<option value="">Escolha um registro do caderno</option>${a.map(e=>`<option value="${e.id}" ${id===e.id?'selected':''}>${esc(labelSub(e.subject)+' · '+e.topic+' — '+(e.questionText?'questão cadastrada':'registro de lacuna'))}</option>`).join('')}`}
function interleavedCandidates(subject='all'){return db.errors.filter(e=>String(e.questionText||'').trim()&&(subject==='all'||e.subject===subject))}
function interleavedTopicCount(rows){return new Set(rows.map(e=>e.subject+'|'+normalize(e.topic))).size}
function learnHistory(){const rows=(db.learningSessions||[]).slice().sort((a,b)=>b.at-a.at).slice(0,8);return rows.length?rows.map(x=>`<div class="learn-history-row"><div><strong>${esc(learnModeLabel(x.mode))} · ${esc(x.topic||'Conhecimento')}</strong><small>${dateTime(x.at)} · ${labelSub(x.subject)}</small></div><span class="tag ${x.grade==='success'?'ok':x.grade==='partial'?'warn':''}">${esc(({success:'Consegui',partial:'Parcial',retry:'Preciso retomar',wrong:'Errei',right:'Acertei'})[x.grade]||'Concluído')}</span></div>`).join(''):`<div class="empty">Suas atividades de aprendizagem aparecerão aqui. Elas não alteram o FSRS nem o caderno de erros.</div>`}
function learnScreen(){const concepts=learnConcepts(),errors=learnErrors(),eligible=interleavedCandidates(learnInterleaveSubject),topics=interleavedTopicCount(eligible);return viewHead('Aprender','Atividades construídas a partir dos seus próprios flashcards e registros do caderno de erros. Sem conteúdo inventado e sem interferir nas revisões.',`<button class="btn secondary" data-view="concepts">Ver flashcards</button><button class="btn secondary" data-view="errors">Caderno de erros</button>`)+`<section class="panel learn-source-summary"><div class="panel-head"><h2>Seu material disponível</h2><span class="tag">Fontes do próprio Ritmo</span></div><div class="learn-counts"><div><strong>${concepts.length}</strong><span>famílias publicadas</span></div><div><strong>${errors.length}</strong><span>registros no caderno</span></div><div><strong>${eligible.length}</strong><span>questões originais cadastradas</span></div></div><p class="tiny">O Ritmo utiliza somente perguntas, respostas, justificativas e questões que você cadastrou. Registros antigos sem enunciado podem apoiar uma atividade de retomada, mas não serão apresentados como questões originais.</p></section><div class="learn-method-grid"><section class="panel learn-method"><div class="learn-icon">✎</div><h2>Explicar um conhecimento</h2><p>Use uma pergunta de uma família de flashcards como ponto de partida. Escreva ou explique em voz alta; depois compare com a resposta cadastrada.</p><div class="field"><label>Conhecimento</label><select id="learn-explain-concept">${learnConceptOptions()}</select></div><button class="btn" data-action="start-learn-explain" ${concepts.length?'':'disabled'}>Começar autoexplicação</button><p class="tiny">Não registra revisão nem altera o FSRS.</p></section><section class="panel learn-method"><div class="learn-icon">↺</div><h2>Recuperar sem consultar</h2><p>Veja o nome de um conhecimento, escreva o que lembra e só depois revele as perguntas e respostas da família.</p><div class="field"><label>Conhecimento</label><select id="learn-recall-concept">${learnConceptOptions()}</select></div><button class="btn" data-action="start-learn-recall" ${concepts.length?'':'disabled'}>Começar recuperação livre</button><p class="tiny">É uma atividade aberta, diferente da revisão individual dos cartões.</p></section><section class="panel learn-method"><div class="learn-icon">◎</div><h2>Retomar um erro</h2><p>Reveja uma questão ou lacuna que você mesmo registrou. O Ritmo mostra a correção somente depois da sua tentativa.</p><div class="field"><label>Registro do caderno</label><select id="learn-error-id">${learnErrorOptions()}</select></div><button class="btn" data-action="start-learn-error" ${errors.length?'':'disabled'}>Retomar registro</button><p class="tiny">Se não houver enunciado original, a atividade será identificada como retomada de lacuna.</p></section><section class="panel learn-method"><div class="learn-icon">⇄</div><h2>Prática intercalada</h2><p>Misture questões originais cadastradas em assuntos diferentes. O Ritmo não cria nem completa questões ausentes.</p><div class="field"><label>Área</label><select id="learn-interleave-subject"><option value="all" ${learnInterleaveSubject==='all'?'selected':''}>TAE e Física</option><option value="tae" ${learnInterleaveSubject==='tae'?'selected':''}>TAE</option><option value="fisica" ${learnInterleaveSubject==='fisica'?'selected':''}>Física</option></select></div><div class="learn-eligibility"><strong>${eligible.length} questões · ${topics} assuntos</strong><small>${topics>=2?'Há material de pelo menos dois assuntos.':'Cadastre enunciados originais em pelo menos dois assuntos para intercalar.'}</small></div><button class="btn" data-action="start-learn-interleave" ${topics>=2?'':'disabled'}>Iniciar sessão intercalada</button></section></div><section class="panel"><div class="panel-head"><h2>Histórico de atividades</h2><span class="tag">${(db.learningSessions||[]).length} registros</span></div><div class="learn-history">${learnHistory()}</div></section>`}
function currentLearnError(){if(!learnState)return null;const id=learnState.queue?.[learnState.index]||learnState.errorId;return db.errors.find(e=>e.id===id)||null}
function learnErrorActivity(e,interleaved=false){const hasOriginal=!!String(e.questionText||'').trim(),options=parseErrorOptions(e.optionsText),autoAvailable=hasOriginal&&options.length>1&&options.every(o=>/^[A-E]$/.test(o.key))&&String(e.correctAnswer||'').trim();const prompt=hasOriginal?rich(e.questionText):rich(e.mistake);let body=`<div class="learn-prompt"><span class="tag">${hasOriginal?'Questão original cadastrada':'Registro de lacuna — sem enunciado original'}</span><h2>${esc(e.topic)}</h2><div class="learn-question-text">${prompt}</div>${hasOriginal&&safeUrl(e.questionUrl)?`<p class="tiny"><a href="${esc(safeUrl(e.questionUrl))}" target="_blank" rel="noopener noreferrer">Abrir fonte da questão ↗</a></p>`:''}</div>`;
 if(!learnState.revealed){if(options.length>1){body+=`<form id="learn-choice-form"><div class="learn-options">${options.map(o=>`<label class="learn-option"><input type="radio" name="learn-choice" value="${esc(o.key)}"><span><strong>${esc(o.key)}.</strong> ${rich(o.text)}</span></label>`).join('')}</div><button class="btn" type="submit">Conferir minha resposta</button></form>`}else{body+=`<form id="learn-response-form"><div class="field"><label>${hasOriginal?'Sua resposta':'O que você consegue explicar sobre esse erro?'}</label><textarea id="learn-response" rows="5" required placeholder="Registre sua tentativa antes de consultar a correção."></textarea></div><button class="btn" type="submit">Revelar correção</button></form>`}}
 else {const auto=learnState.autoGrade;const pickedOption=options.find(o=>o.key===learnState.response);body+=`<div class="learn-own-response"><h3>Sua tentativa</h3><p>${pickedOption?esc(pickedOption.key+'. '+pickedOption.text):esc(learnState.response||'Você explicou oralmente; compare sua explicação com a referência.')}</p></div><div class="learn-reference"><h3>Correção cadastrada</h3><p>${rich(e.fix)}</p>${e.correctAnswer?`<p class="tiny"><strong>Gabarito informado:</strong> ${esc(e.correctAnswer)}</p>`:''}${e.optionsText?`<details><summary>Ver alternativas cadastradas</summary><p>${rich(e.optionsText)}</p></details>`:''}</div>${auto?`<div class="message ${auto==='right'?'success-dot':'danger-dot'}">${auto==='right'?'Resposta correspondente ao gabarito cadastrado.':'Sua resposta não corresponde ao gabarito cadastrado.'}</div><button class="btn" data-action="learn-grade" data-grade="${auto==='right'?'right':'wrong'}">Registrar resultado e continuar</button>`:`<p class="muted">Compare sua tentativa com a correção original. O Ritmo não avalia automaticamente respostas abertas.</p><div class="button-row"><button class="btn" data-action="learn-grade" data-grade="right">Consegui resolver</button><button class="btn secondary" data-action="learn-grade" data-grade="partial">Parcialmente</button><button class="btn danger" data-action="learn-grade" data-grade="wrong">Ainda tenho dificuldade</button></div>`}`}
 return body}
function learnRunScreen(){if(!learnState)return viewHead('Aprender','Nenhuma atividade em andamento.',`<button class="btn secondary" data-view="learn">← Voltar</button>`)+`<div class="empty">Escolha uma atividade para começar.</div>`;const mode=learnState.mode;let content='';if(mode==='explain'||mode==='recall'){const c=db.concepts.find(x=>x.id===learnState.conceptId);if(!c)return viewHead('Aprender')+`<div class="empty">Esse conhecimento não está mais disponível.</div>`;const variants=activeVariants(c).map(x=>x.v),v=variants.find(x=>x.id===learnState.variantId)||variants[0];if(mode==='explain'){content=`<section class="panel learn-run"><span class="tag">Autoexplicação · ${esc(labelSub(c.subject))}</span><h2>${esc(c.topic)}</h2><p class="muted">Explique com suas próprias palavras. Você pode escrever ou falar em voz alta sem gravar.</p><div class="learn-question-text">${rich(v.q)}</div>${!learnState.revealed?`<form id="learn-response-form"><div class="field"><label>Sua explicação (opcional se preferir falar em voz alta)</label><textarea id="learn-response" rows="5" placeholder="Explique como se estivesse ensinando alguém... "></textarea></div><button class="btn" type="submit">Comparar com o cartão</button></form>`:`<div class="learn-own-response"><h3>Sua explicação</h3><p>${learnState.response?rich(learnState.response):'Você explicou oralmente; compare sua explicação com a referência.'}</p></div><div class="learn-reference"><h3>Resposta cadastrada</h3><p>${rich(v.a)}</p>${v.reason?`<h3>Justificativa</h3><p>${rich(v.reason)}</p>`:''}<p class="tiny">Fonte: ${esc(v.source||c.source||'Não informada')}</p></div><p class="muted">Compare sua explicação. O Ritmo não atribui nota automática a uma explicação aberta.</p><div class="button-row"><button class="btn" data-action="learn-grade" data-grade="success">Consegui explicar</button><button class="btn secondary" data-action="learn-grade" data-grade="partial">Parcialmente</button><button class="btn danger" data-action="learn-g  else {const e=currentLearnError();if(!e)return viewHead('Aprender','Registro não encontrado.',`<button class="btn secondary" data-view="learn">← Voltar</button>`)+`<div class="empty">O registro foi removido ou não está disponível.</div>`;content=`<section class="panel learn-run"><div class="row-between"><span class="tag">${mode==='interleave'?'Prática intercalada':'Retomar erro'} · ${esc(labelSub(e.subject))}</span>${mode==='interleave'?`<span class="tag">Questão ${learnState.index+1} de ${learnState.queue.length}</span>`:''}</div>${learnErrorActivity(e,mode==='interleave')}</section>`}
 return viewHead(learnModeLabel(mode),'Atividade baseada somente nos seus registros. Não altera o FSRS nem o calendário do caderno.',`<button class="btn secondary" data-action="cancel-learn">Sair da atividade</button>`)+`<div class="learn-run-wrap">${content}</div>`}
function startLearnMode(mode){learnState=null;if(mode==='explain'||mode==='recall'){const id=document.getElementById(mode==='explain'?'learn-explain-concept':'learn-recall-concept')?.value,c=db.concepts.find(x=>x.id===id&&isPublished(x));if(!c)return alert('Selecione uma família de flashcards publicada.');const variants=activeVariants(c).map(x=>x.v);const v=variants[Math.floor(Math.random()*variants.length)];learnState={mode,conceptId:id,variantId:v.id,startedAt:now(),revealed:false,response:'',results:[]};goto('learnRun');return}
 if(mode==='error'){const id=document.getElementById('learn-error-id')?.value,e=db.errors.find(x=>x.id===id);if(!e)return alert('Selecione um registro do caderno.');learnState={mode,errorId:id,queue:[id],index:0,startedAt:now(),revealed:false,response:'',results:[]};goto('learnRun');return}
 if(mode==='interleave'){const subject=document.getElementById('learn-interleave-subject')?.value||'all',rows=interleavedCandidates(subject);if(interleavedTopicCount(rows)<2)return alert('Para intercalar, cadastre enunciados originais em pelo menos dois assuntos.');const groups=new Map();rows.forEach(e=>{const k=e.subject+'|'+normalize(e.topic);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});for(const a of groups.values())a.sort(()=>Math.random()-.5);const keys=[...groups.keys()].sort(()=>Math.random()-.5),queue=[];while(keys.some(k=>groups.get(k).length)){for(const k of keys){const e=groups.get(k).shift();if(e)queue.push(e.id);if(queue.length>=12)break}if(queue.length>=12)break}learnState={mode,queue,index:0,startedAt:now(),revealed:false,response:'',results:[]};goto('learnRun');}}
function currentLearnItem(){if(!learnState)return null;if(learnState.mode==='explain'||learnState.mode==='recall')return db.concepts.find(c=>c.id===learnState.conceptId);return currentLearnError()}
function learnAutoGrade(selected,e){const picked=String(selected||'').trim().toUpperCase(),answer=String(e.correctAnswer||'').trim().toUpperCase();const key=x=>{const m=x.match(/^(?:ALTERNATIVA\s*)?([A-E])(?:[\).:\-\s]|$)/);return m?m[1]:normalize(x).replace(/\s+/g,'')};return key(picked)===key(answer)?'right':'wrong'}
function saveLearnGrade(grade){if(!learnState)return;const mode=learnState.mode,item=currentLearnItem();if(!item)return;const isConcept=mode==='explain'||mode==='recall',record={id:uid(),mode,sourceType:isConcept?'flashcard-family':'error-notebook',sourceId:item.id,subject:item.subject,topic:isConcept?item.topic:item.topic,at:now(),startedAt:learnState.startedAt,grade,response:learnState.response||'',autoGraded:!!learnState.autoGrade,prompt:mode==='explain'?item.variants.find(v=>v.id===learnState.variantId)?.q:mode==='recall'?item.topic:item.questionText||item.mistake};if(mode==='interleave'){learnState.results.push(record);learnState.index++;learnState.revealed=false;learnState.response='';learnState.autoGrade='';if(learnState.index<learnState.queue.length){render();window.scrollTo(0,0);return}db.learningSessions.push(...learnState.results);save();learnState=null;goto('learn');notify('Sessão intercalada concluída. O histórico foi salvo sem alterar o caderno de erros.');return}db.learningSessions.push(record);save();learnState=null;goto('learn');notify('Atividade registrada. Flashcards e agendamentos permaneceram intactos.')}

iv class="field"><label>Alternativas (uma por linha)</label><textarea id="error-options-text" rows="4" placeholder="A) ...&#10;B) ...&#10;C) ...&#10;D) ...">${esc(e?.optionsText||'')}</textarea></div><div class="field"><label>Gabarito (ex.: B)</label><input id="error-correct-answer" maxlength="80" value="${esc(e?.correctAnswer||'')}" placeholder="Ex.: C"></div><p class="tiny">Esses dados permitem reutilizar a questão exata em atividades de aprendizagem. Se não preencher, o Ritmo utilizará somente o registro de erro e a correção, sem inventar um enunciado.</p></details><div class="field"><label>Link da questão (opcional)</label><input id="error-url" type="url" value="${esc(e?.questionUrl||'')}"></div><div class="field"><label>Conectar aos flashcards do conhecimento</label><select id="error-concept">${subjectConceptOptions(sub,e?.conceptId||'')}</select></div>${footerButtons('Salvar erro')}</form>`)}
function saveError(){let sub=document.getElementById('error-subject').value,dis=document.getElementById('error-discipline').value,area=document.getElementById('error-area').value,topic=document.getElementById('error-topic').value,mistake=document.getElementById('error-mistake').value.trim(),fix=document.getElementById('error-fix').value.trim(),reviewDays=Number(document.getElementById('error-days').value),url=document.getElementById('error-url').value.trim(),questionText=document.getElementById('error-question-text')?.value.trim()||'',optionsText=document.getElementById('error-options-text')?.value.trim()||'',correctAnswer=document.getElementById('error-correct-answer')?.value.trim()||'';if(!dis||!area||!topic)return alert('Selecione disciplina, área e assunto.');if(!mistake||!fix)return alert('Descreva o erro e sua correção.');if(url&&!safeUrl(url))return alert('URL inválida.');let conceptId=document.getElementById('error-concept').value,old=db.errors.find(x=>x.id===editErrorId);if(old){Object.assign(old,{subject:sub,discipline:dis,area,topic,mistake,fix,type:document.getElementById('error-type').value,reviewDays,questionUrl:url,conceptId,questionText,optionsText,correctAnswer});if(old.status==='dominado')old.status='pendente'}else{db.errors.push({id:uid(),subject:sub,discipline:dis,area,topic,type:document.getElementById('error-type').value,mistake,fix,reviewDays,questionUrl:url,conceptId,questionText,optionsText,correctAnswer,at:now(),nextReview:now()+reviewDays*DAY,successes:0,failures:0,status:'pendente',history:[]})}save();closeModal();render()}
function applyErrorModal(id){let e=db.errors.find(e=>e.id===id);if(!e)return;showModal(modalHeader('Nova aplicação · '+e.topic)+`<div class="field"><label>Erro anterior</label><div class="soft-box">${rich(e.mistake)}</div></div><div class="field"><label>Correção registrada</label><div class="soft-box">${rich(e.fix)}</div></div>${safeUrl(e.questionUrl)?`<p class="muted"><a href="${esc(safeUrl(e.questionUrl))}" target="_blank" rel="noopener noreferrer">Questão original ↗</a> (prefira outra questão inédita)</p>`:''}<p class="muted">Resolva uma <strong>nova questão</strong> sobre esse conhecimento e registre o resultado. Esta avaliação não altera o FSRS dos flashcards.</p><div class="button-row"><button class="btn danger" data-action="grade-error" data-id="${e.id}" data-grade="wrong">Errei novamente</button><button class="btn" data-action="grade-error" data-id="${e.id}" data-grade="right">Acertei uma inédita</button></div><div class="modal-foot"><button class="btn secondary" data-action="close-modal">Cancelar</button></div>`)}
function gradeError(id,grade){let e=db.errors.find(x=>x.id===id);if(!e)return;const at=now();e.history=e.history||[];e.history.push({at,grade});if(grade==='right'){const prior=e.history.filter(h=>h.grade==='right').slice(0,-1);const counted=prior.some(h=>dateKey(h.at)===dateKey(at));if(!counted)e.successes=(e.successes||0)+1;e.reviewDays=Math.min(90,[1,3,7,15,30,60,90].find(x=>x>e.reviewDays)||90);e.status=e.successes>=2?'dominado':'pendente'}else{e.failures=(e.failures||0)+1;e.successes=0;e.status='pendente';e.reviewDays=e.failures>=2?1:3}e.nextReview=at+e.reviewDays*DAY;save();closeModal();render();notify(e.status==='dominado'?'Registro dominado após duas novas aplicações corretas.':'Próxima aplicação agendada.')}
function normalizeImport(raw){let families=Array.isArray(raw)?raw:(Array.isArray(raw.familias)?raw.familias:raw.concepts||[]);if(!families.length||families.length>250)throw Error('Arquivo sem famílias ou com mais de 250 famílias.');return families.map((c,i)=>{let cards=c.cartoes||c.variants||c.cards||[],subject=/fis/i.test(c.disciplina||c.subject||'')?'fisica':'tae',topic=String(c.assunto||c.topic||'').trim();if(!topic||!Array.isArray(cards)||cards.length<1||cards.length>10)throw Error(`Família ${i+1}: nome ou quantidade inválida (1 a 10).`);let variants=cards.map((v,j)=>{let q=String(v.pergunta||v.q||'').trim(),a=String(v.resposta||v.a||'').trim(),format=v.formato||v.format||'basic';if(!q||!a||q.length>5000||a.length>5000)throw Error(`Família ${i+1}, cartão ${j+1}: pergunta/resposta inválida.`);if(!['basic','cloze','typed','image'].includes(format))format='basic';return {kind:String(v.tipo||v.kind||'Definição'),format,q,a,reason:String(v.justificativa||v.reason||''),source:String(v.fonte||v.source||''),image:typeof v.image==='string'&&(/^data:image\/(png|jpeg|webp);base64,/i.test(v.image)?v.image:'') ,mask:v.mask||null,status:'pending'}});return {subject,topic,source:String(c.fonte||c.source||''),variants}})}
function parseCsv(t){let rows=[],row=[],buf='',q=false;for(let i=0;i<t.length;i++){let ch=t[i];if(ch==='"'){if(q&&t[i+1]==='"'){buf+='"';i++}else q=!q}else if(ch===','&&!q){row.push(buf);buf=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(buf);buf='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else buf+=ch}row.push(buf);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('CSV sem registros.');let headers=rows[0].map(x=>normalize(x).replace(/ /g,''));const col=(row,...names)=>{for(const n of names){let i=headers.indexOf(normalize(n).replace(/ /g,''));if(i>=0)return row[i]||''}return ''};let families=new Map();for(const line of rows.slice(1)){const subject=/fis/i.test(col(line,'disciplina','subject'))?'fisica':'tae',topic=col(line,'assunto','topic');if(!topic)continue;let key=subject+'|'+topic;let f=families.get(key)||{subject,topic,source:col(line,'fonte','source'),variants:[]};f.variants.push({q:col(line,'pergunta','q'),a:col(line,'resposta','a'),kind:col(line,'tipo','kind'),reason:col(line,'justificativa','reason'),format:col(line,'formato','format'),source:col(line,'fonte','source')});families.set(key,f)}return [...families.values()]}
function previewImport(){const t=document.getElementById('import-cards-text')?.value.trim()||'';if(!t)return alert('Escolha um arquivo ou cole os dados.');try{let raw=t.startsWith('{')||t.startsWith('[')?JSON.parse(t):parseCsv(t);importDraft=normalizeImport(raw);render();notify(importDraft.length+' família(s) prontas para curadoria.')}catch(e){importDraft=null;alert('Erro ao interpretar arquivo: '+e.message)}}
function importConfirm(){if(!importDraft)return;db.concepts.push(...importDraft.map(x=>mkConcept(x,'draft')));importDraft=null;save();expandedDraft=db.concepts.find(x=>x.status==='draft')?.id||'';goto('curation');notify('Cartões importados como rascunho. Confira as fontes e aprove as versões.')}
function variantModal(id,i){let c=db.concepts.find(x=>x.id===id),v=c?.variants?.[i];if(!v)return;editConceptId=id;window.variantEditing={id,i};showModal(modalHeader('Revisar versão')+`<form id="edit-variant-form"><div class="form-row"><div class="field"><label>Modalidade</label><select id="variant-kind">${kindsOptions(v.kind)}</select></div><div class="field"><label>Formato</label><select id="variant-format"><option value="basic" ${v.format==='basic'?'selected':''}>Pergunta / resposta</option><option value="cloze" ${v.format==='cloze'?'selected':''}>Lacuna</option><option value="typed" ${v.format==='typed'?'selected':''}>Resposta digitada</option><option value="image" ${v.format==='image'?'selected':''}>Imagem</option></select></div></div><div class="field"><label>Pergunta</label><textarea id="variant-q" required rows="3">${esc(v.q)}</textarea></div><div class="field"><label>Resposta</label><textarea id="variant-a" required rows="3">${esc(v.a)}</textarea></div><div class="field"><label>Justificativa</label><textarea id="variant-reason" rows="3">${esc(v.reason)}</textarea></div><div class="field"><label>Fonte</label><input id="variant-source" value="${esc(v.source||c.source)}"></div>${footerButtons('Salvar e manter pendente')}</form>`)}
function publishDraft(id){let c=db.concepts.find(x=>x.id===id);if(!c)return;if(!activeVariants(c).length)return alert('Aprove ao menos uma versão.');if(activeVariants(c).some(({v})=>!v.source&&!c.source))return alert('Cadastre uma fonte para cada versão aprovada ou para a família.');if(activeVariants(c).some(({v})=>v.format==='image'&&!v.image))return alert('Uma versão com imagem está sem imagem. Edite ou rejeite.');if(activeVariants(c).some(({v})=>v.format==='cloze'&&!/\{\{c\d+::[^}]+\}\}/.test(v.q)))return alert('Uma lacuna não está formatada como {{c1::palavra}}. Edite ou rejeite.');c.variants=c.variants.filter(v=>v.status==='approved');c.status='published';c.fsrs={s:0,d:0,last:0,reps:0,lapses:0,interval:0,due:now()-1};save();render();notify('Família publicada e pronta para revisão.')}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}

function inspectConcept(id){let c=db.concepts.find(c=>c.id===id);if(!c)return;let logs=db.reviews.filter(r=>r.conceptId===id).slice(-25).reverse(),r=retrievability(c.fsrs);showModal(modalHeader('Histórico — '+c.topic)+`<div class="grid"><div class="summary-tile">Estabilidade <strong>${c.fsrs.s?number(c.fsrs.s)+' dias':'—'}</strong></div><div class="summary-tile">Dificuldade <strong>${c.fsrs.d?number(c.fsrs.d)+'/10':'—'}</strong></div><div class="summary-tile">Recuperação estimada <strong>${r===null?'—':Math.round(r*100)+'%'}</strong></div><div class="summary-tile">Esquecimentos <strong>${c.fsrs.lapses}</strong></div></div><div class="panel-head" style="margin-top:20px"><h2>Desempenho por versão</h2></div>${c.variants.map(v=>`<div class="list-compact"><span><strong>${esc(v.kind)}</strong><small>${esc(v.q.slice(0,75))}</small></span><span class="tag">${v.uses} tentativas · ${fmtPct(v.passes,v.uses)}</span></div>`).join('')}<div class="panel-head" style="margin-top:20px"><h2>Últimas revisões</h2></div>${logs.length?logs.map(x=>`<div class="list-compact"><span>${dateTime(x.at)} · ${esc(x.kind)}</span><strong>${{again:'Errei',hard:'Difícil',good:'Bom',easy:'Fácil'}[x.grade]}</strong></div>`).join(''):`<p class="muted">Este conhecimento ainda não foi revisado.</p>`}${linkedErrors(id).length?`<p class="notice">${linkedErrors(id).length} erro(s) do caderno vinculados a este conhecimento.</p>`:''}<div class="modal-foot"><button class="btn secondary" data-action="close-modal">Fechar</button></div>`)}
function dayModal(date){let dates=[...db.reviews.filter(r=>!r.preview),...db.blocks,...db.errors,...(db.learningSessions||[])].filter(x=>dateKey(x.at)===date);showModal(modalHeader('Atividades de '+date)+`<p class="muted">${dates.length} registros neste dia.</p>${dates.map(x=>`<div class="list-compact"><span>${'grade'in x?'Revisão':'total'in x?'Questões':x.mode?'Aprender · '+learnModeLabel(x.mode):'Caderno'} · ${esc(x.topic||'Conhecimento')}</span><small>${dateTime(x.at)}</small></div>`).join('')||'<div class="empty">Nenhuma atividade</div>'}`)}
function addTaxonomy(id){let val=prompt('Nome para adicionar ao seletor:');if(!val)return;val=val.trim().replace(/\s+/g,' ');if(!val||val.length>90||['__proto__','constructor','prototype'].includes(val.toLowerCase()))return alert('Nome inválido.');let sub=document.getElementById('error-subject').value,dis=document.getElementById('error-discipline').value,area=document.getElementById('error-area').value;db.catalog[sub]??={};if(id==='error-discipline'){db.catalog[sub][val]??={};}else if(id==='error-area'){if(!dis)return alert('Selecione uma disciplina.');db.catalog[sub][dis]??={};db.catalog[sub][dis][val]??=[];}else if(id==='error-topic'){if(!dis||!area)return alert('Selecione disciplina e área.');db.catalog[sub][dis]??={};db.catalog[sub][dis][area]??=[];if(!db.catalog[sub][dis][area].includes(val))db.catalog[sub][dis][area].push(val)}save();return val}
