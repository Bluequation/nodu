name: Validate Ritmo 8

on:
  push:
    branches: [refactor/ritmo-8]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Planner browser regression
        run: node scripts/check-planner.mjs
      - name: Save planner screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-screenshots
          path: planner-screenshots/
          if-no-files-found: ignore
